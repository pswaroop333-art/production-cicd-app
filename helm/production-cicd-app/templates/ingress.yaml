{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: production-cicd-app-ingress
  namespace: production

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: production-cicd-app-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}
